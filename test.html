<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Upload - Buổi 07</title>
</head>
<body>
    <h2>Kiểm thử Tải tệp (Lấy Ảnh 23)</h2>
    <!-- Quan trọng: action phải trỏ đúng API của bạn, method="POST", enctype="multipart/form-data" -->
    <form action="http://localhost:3000/api/v1/movies/upload-poster" method="POST" enctype="multipart/form-data">
        <!-- Đảm bảo name="poster" khớp với upload.single('poster') trong Node.js -->
        <input type="file" name="poster" required>
        <button type="submit">Upload Test</button>
    </form>
</body>
</html>
